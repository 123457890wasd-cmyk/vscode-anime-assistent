<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    :root {
      --accent: #ff6b9d;
      --accent-dim: #c04a78;
      --accent-glow: rgba(255, 107, 157, 0.45);
      --purple: #c084fc;
      --text: #eef0f6;
      --muted: #8888aa;
      --error-border: #ff4757;
      --bubble-bg: rgba(26, 36, 60, 0.92);
      --hair: #f8a4c2;
      --hair-dark: #e8789a;
      --skin: #ffe4d0;
      --eye: #5b3a6e;
      --blush: #ffb3c1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      color: var(--text);
      user-select: none; -webkit-user-select: none;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: 8px 8px 12px;
    }

    /* ===== 气泡区域 ===== */
    .bubble-area {
      width: 100%; max-width: 264px;
      display: flex; flex-direction: column-reverse;
      align-items: center; gap: 7px;
      margin-bottom: 8px;
      pointer-events: none;
    }
    .bubble {
      position: relative; max-width: 100%;
      padding: 8px 13px; border-radius: 14px;
      border: 1px solid transparent;
      background:
        linear-gradient(var(--bubble-bg), var(--bubble-bg)) padding-box,
        linear-gradient(135deg, rgba(255,107,157,0.55), rgba(192,132,252,0.35), rgba(255,107,157,0.2)) border-box;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      font-size: 12px; line-height: 1.55;
      white-space: pre-wrap; word-break: break-word;
      text-align: center;
      animation: popUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow:
        0 4px 16px rgba(0, 0, 0, 0.4),
        0 0 20px rgba(255, 107, 157, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      pointer-events: auto;
    }
    /* 气泡顶部高光条 */
    .bubble::before {
      content: ''; position: absolute;
      top: 1px; left: 14px; right: 14px; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
      border-radius: 1px;
    }
    /* 气泡尾巴 */
    .bubble::after {
      content: ''; position: absolute; bottom: -7px; left: 50%;
      transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-top: 7px solid rgba(200, 130, 170, 0.45);
    }
    .bubble.error {
      background:
        linear-gradient(rgba(60, 22, 30, 0.92), rgba(60, 22, 30, 0.92)) padding-box,
        linear-gradient(135deg, rgba(255,71,87,0.7), rgba(255,120,100,0.35)) border-box;
      box-shadow:
        0 4px 18px rgba(0, 0, 0, 0.4),
        0 0 24px rgba(255, 71, 87, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      animation: popUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), shake 0.35s 0.38s ease;
    }
    .bubble.error::after { border-top-color: rgba(255, 71, 87, 0.55); }
    .bubble.old {
      opacity: 0.45; transform: scale(0.92);
      filter: saturate(0.6);
      transition: all 0.5s ease;
    }
    .bubble.fade-out {
      opacity: 0; transform: translateY(-8px) scale(0.85);
      transition: all 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes popUp {
      from { opacity: 0; transform: translateY(14px) scale(0.8); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-3px); }
      75% { transform: translateX(3px); }
    }

    /* ===== 角色立绘区（拖拽手柄） ===== */
    .character-wrapper {
      display: flex; flex-direction: column;
      align-items: center; gap: 2px;
      cursor: grab; padding: 6px;
      border-radius: 16px; transition: background 0.25s;
    }
    .character-wrapper:active { cursor: grabbing; }
    .character-wrapper:hover { background: rgba(255,107,157,0.05); }

    /* 角色容器 */
    .character-box {
      width: 160px; height: 210px;
      position: relative;
      display: flex; align-items: center; justify-content: center;
      animation: idleSway 4s infinite ease-in-out;
    }
    /* 角色背后柔光 */
    .character-box::before {
      content: ''; position: absolute;
      width: 140px; height: 140px;
      left: 50%; bottom: 15px; transform: translateX(-50%);
      background: radial-gradient(circle, rgba(255,107,157,0.10) 0%, rgba(192,132,252,0.05) 45%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }
    @keyframes idleSway {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-3px) rotate(0.5deg); }
      75% { transform: translateY(-2px) rotate(-0.5deg); }
    }

    /* 地面阴影 */
    .ground-shadow {
      width: 90px; height: 14px;
      margin-top: -8px;
      background: radial-gradient(ellipse, rgba(0,0,0,0.35) 0%, transparent 70%);
      border-radius: 50%;
      animation: shadowPulse 4s infinite ease-in-out;
    }
    @keyframes shadowPulse {
      0%, 100% { transform: scaleX(1); opacity: 0.8; }
      25% { transform: scaleX(0.92); opacity: 0.6; }
      75% { transform: scaleX(0.95); opacity: 0.7; }
    }

    /* 氛围粒子 */
    .sparkle {
      position: absolute; width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0; pointer-events: none;
      animation: twinkle 3.5s infinite ease-in-out;
    }
    .sparkle:nth-child(1) { left: 18px; top: 60px; animation-delay: 0s; }
    .sparkle:nth-child(2) { right: 14px; top: 45px; animation-delay: 1.2s; width: 3px; height: 3px; background: var(--purple); }
    .sparkle:nth-child(3) { left: 30px; top: 130px; animation-delay: 2.1s; width: 3px; height: 3px; }
    .sparkle:nth-child(4) { right: 26px; top: 115px; animation-delay: 0.7s; width: 5px; height: 5px; background: rgba(255,255,255,0.9); }
    @keyframes twinkle {
      0%, 100% { opacity: 0; transform: translateY(0) scale(0.5); }
      50% { opacity: 0.8; transform: translateY(-6px) scale(1); }
    }

    /* 自定义图片 */
    .character-box img {
      max-width: 100%; max-height: 100%;
      object-fit: contain;
      pointer-events: none;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
    }

    /* ===== CSS 默认角色 ===== */
    .css-character { display: none; position: relative; width: 100%; height: 100%; }
    .css-character.visible { display: block; }

    /* 身体 */
    .chibi-body {
      position: absolute; bottom: 10px; left: 50%;
      transform: translateX(-50%);
      width: 50px; height: 55px;
      background: linear-gradient(180deg, #f8e0f0 0%, #e8d0e8 100%);
      border-radius: 20px 20px 25px 25px;
      border: 1.5px solid #d8b8d8;
      animation: breathe 3.2s infinite ease-in-out;
      transform-origin: bottom center;
    }
    @keyframes breathe {
      0%, 100% { transform: translateX(-50%) scaleY(1); }
      50% { transform: translateX(-50%) scaleY(1.025); }
    }
    /* 领结 */
    .chibi-body::after {
      content: ''; position: absolute; top: 8px; left: 50%;
      transform: translateX(-50%);
      width: 16px; height: 8px;
      background: linear-gradient(135deg, var(--accent), #ff8fb3);
      border-radius: 4px;
      box-shadow: 0 1px 4px rgba(255,107,157,0.4);
    }

    /* 头部 */
    .chibi-head {
      position: absolute; bottom: 55px; left: 50%;
      transform: translateX(-50%);
      width: 68px; height: 78px;
      background: linear-gradient(180deg, #fff0e4 0%, var(--skin) 60%);
      border-radius: 35px 35px 30px 30px;
      border: 1.5px solid #e8c8b8;
    }
    /* 头发 */
    .chibi-hair {
      position: absolute; bottom: 52px; left: 50%;
      transform: translateX(-50%);
      width: 74px; height: 60px;
      background: linear-gradient(180deg, var(--hair-dark) 0%, var(--hair) 40%, var(--hair-dark) 100%);
      border-radius: 40px 40px 8px 8px;
      box-shadow: inset 0 4px 8px rgba(255,255,255,0.25), 0 2px 6px rgba(0,0,0,0.15);
    }
    /* 刘海 */
    .chibi-bangs {
      position: absolute; top: 0; left: 50%;
      transform: translateX(-50%);
      width: 60px; height: 30px;
      background: var(--hair-dark);
      border-radius: 0 0 20px 20px;
    }
    /* 眼睛 */
    .chibi-eye {
      position: absolute; width: 18px; height: 20px;
      background: #fff; border-radius: 50%;
      border: 2px solid var(--eye);
      top: 28px;
      animation: blink 4.6s infinite;
      transform-origin: center;
    }
    .chibi-eye.left { left: 14px; }
    .chibi-eye.right { right: 14px; }
    @keyframes blink {
      0%, 90%, 100% { transform: scaleY(1); }
      94% { transform: scaleY(0.08); }
      98% { transform: scaleY(1); }
    }
    .chibi-eye::after {
      content: ''; position: absolute;
      width: 10px; height: 12px;
      background: radial-gradient(circle at 40% 35%, #7b5a8e 0%, var(--eye) 60%);
      border-radius: 50%;
      top: 3px; left: 50%; transform: translateX(-50%);
    }
    /* 眼睛高光 */
    .chibi-eye::before {
      content: ''; position: absolute;
      width: 5px; height: 5px;
      background: #fff; border-radius: 50%;
      top: 2px; left: 3px; z-index: 2;
      box-shadow: 6px 7px 0 -1.5px rgba(255,255,255,0.6);
    }
    /* 腮红 */
    .chibi-blush {
      position: absolute; width: 12px; height: 7px;
      background: radial-gradient(ellipse, var(--blush), transparent 75%);
      border-radius: 50%;
      top: 43px; opacity: 0.8;
    }
    .chibi-blush.left { left: 6px; }
    .chibi-blush.right { right: 6px; }
    /* 嘴 */
    .chibi-mouth {
      position: absolute; width: 8px; height: 4px;
      border-bottom: 2px solid #d4787a;
      border-radius: 0 0 8px 8px;
      top: 50px; left: 50%; transform: translateX(-50%);
    }

    /* ===== CSS 情绪变体（通过 data-emotion 切换） ===== */

    /* angry: 眉头倒竖 + 嘴巴变尖 */
    .character-box[data-emotion="angry"] .chibi-mouth {
      width: 6px; height: 5px;
      border-bottom: none;
      border-left: 3px solid transparent;
      border-right: 3px solid transparent;
      border-top: 5px solid #d4787a;
      border-radius: 2px;
      top: 49px;
    }
    .character-box[data-emotion="angry"] .chibi-eye { animation: none; }
    .angry-brow { display: none; }
    .character-box[data-emotion="angry"] .angry-brow {
      display: block; position: absolute;
      width: 14px; height: 2.5px; background: var(--eye);
      border-radius: 1px; top: 22px;
    }
    .character-box[data-emotion="angry"] .angry-brow.left {
      left: 10px; transform: rotate(-15deg);
    }
    .character-box[data-emotion="angry"] .angry-brow.right {
      right: 10px; transform: rotate(15deg);
    }
    /* angry 青筋 */
    .angry-vein { display: none; }
    .character-box[data-emotion="angry"] .angry-vein {
      display: block; position: absolute;
      font-size: 14px; top: 8px; right: 30px;
      color: #ff4757;
      animation: veinPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes veinPop {
      from { transform: scale(0); }
      to { transform: scale(1); }
    }

    /* happy: 嘴巴张开微笑 + 腮红更大 */
    .character-box[data-emotion="happy"] .chibi-mouth {
      width: 10px; height: 5px;
      border-bottom: 2px solid #e8788a;
      border-radius: 0 0 10px 10px;
      top: 50px;
    }
    .character-box[data-emotion="happy"] .chibi-blush {
      width: 15px; height: 9px; opacity: 1;
    }
    /* happy 星星眼 */
    .character-box[data-emotion="happy"] .chibi-eye::after {
      background: radial-gradient(circle at 40% 35%, #f0a0b8 0%, #e8789a 60%);
    }
    .character-box[data-emotion="happy"] .chibi-eye { animation: none; transform: scaleY(0.85); }

    /* surprised: 大眼睛 + 圆嘴（惊讶时不眨眼） */
    .character-box[data-emotion="surprised"] .chibi-eye {
      width: 21px; height: 23px;
      animation: none;
    }
    .character-box[data-emotion="surprised"] .chibi-eye::after {
      width: 8px; height: 10px; top: 5px;
    }
    .character-box[data-emotion="surprised"] .chibi-mouth {
      width: 10px; height: 9px;
      border: 2px solid #d4787a;
      border-radius: 50%;
      background: #e8788a;
      top: 48px;
    }

    /* greeting: 微妙笑容 */
    .character-box[data-emotion="greeting"] .chibi-mouth {
      width: 9px; height: 4px;
      border-bottom: 2px solid #d89098;
      border-radius: 0 0 9px 9px;
      top: 49px;
    }

    /* 情绪切换过渡 */
    .character-box .chibi-eye,
    .character-box .chibi-mouth,
    .character-box .chibi-blush {
      transition: all 0.3s ease;
    }

    /* ===== 名字和状态 ===== */
    .pet-name {
      font-size: 13px; font-weight: 700;
      letter-spacing: 3px;
      margin-top: 0;
      background: linear-gradient(135deg, #ff6b9d 20%, #c084fc 80%);
      -webkit-background-clip: text; background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 8px var(--accent-glow));
    }
    .pet-status {
      font-size: 10px; color: var(--muted);
      margin-top: 1px;
    }
    .pet-status .dot {
      display: inline-block; width: 6px; height: 6px;
      border-radius: 50%; background: #4ade80;
      margin-right: 4px; vertical-align: middle;
      box-shadow: 0 0 6px rgba(74,222,128,0.6);
      position: relative;
    }
    .pet-status .dot::after {
      content: ''; position: absolute;
      inset: -2px; border-radius: 50%;
      border: 1px solid rgba(74,222,128,0.5);
      animation: dotPulse 2s infinite ease-out;
    }
    @keyframes dotPulse {
      0% { transform: scale(1); opacity: 0.7; }
      100% { transform: scale(2.1); opacity: 0; }
    }
    .pet-status .dot.offline { background: #666; box-shadow: none; }
    .pet-status .dot.offline::after { display: none; }

    /* ===== 右键菜单 ===== */
    .context-menu {
      position: fixed;
      background: rgba(22, 24, 40, 0.97);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,107,157,0.25);
      border-radius: 10px; padding: 5px;
      min-width: 120px; z-index: 999;
      box-shadow: 0 8px 28px rgba(0,0,0,0.55), 0 0 16px rgba(255,107,157,0.06);
      opacity: 0; visibility: hidden;
      transform: scale(0.92) translateY(-4px);
      transform-origin: top left;
      transition: opacity 0.18s ease, transform 0.18s cubic-bezier(0.34, 1.4, 0.64, 1), visibility 0.18s;
    }
    .context-menu.show {
      opacity: 1; visibility: visible;
      transform: scale(1) translateY(0);
    }
    .context-menu .menu-item {
      padding: 7px 12px; font-size: 12px;
      cursor: pointer; color: var(--text);
      border-radius: 7px;
      transition: background 0.15s, padding-left 0.15s;
    }
    .context-menu .menu-item:hover {
      background: rgba(255,107,157,0.16);
      padding-left: 15px;
    }
    .context-menu .menu-item:active {
      background: rgba(255,107,157,0.28);
    }

    /* ===== 减弱动效偏好 ===== */
    @media (prefers-reduced-motion: reduce) {
      .character-box, .sparkle, .chibi-eye, .chibi-body,
      .ground-shadow, .pet-status .dot::after {
        animation: none !important;
      }
    }
  </style>
</head>
<body>

  <!-- 气泡展示区 -->
  <div class="bubble-area" id="bubbleArea"></div>

  <!-- 角色立绘区（拖拽手柄） -->
  <div class="character-wrapper" id="petArea">
    <div class="character-box" id="charBox">
      <!-- 氛围粒子 -->
      <span class="sparkle"></span>
      <span class="sparkle"></span>
      <span class="sparkle"></span>
      <span class="sparkle"></span>
      <!-- 自定义图片（优先级最高） -->
      <img id="charImg" src="" alt="Airi" style="display:none" />
      <!-- CSS 默认角色 -->
      <div class="css-character visible" id="cssChar">
        <div class="chibi-hair"></div>
        <div class="chibi-bangs"></div>
        <div class="chibi-head"></div>
        <div class="chibi-eye left"></div>
        <div class="chibi-eye right"></div>
        <div class="angry-brow left"></div>
        <div class="angry-brow right"></div>
        <div class="angry-vein">💢</div>
        <div class="chibi-blush left"></div>
        <div class="chibi-blush right"></div>
        <div class="chibi-mouth"></div>
        <div class="chibi-body"></div>
      </div>
    </div>
    <div class="ground-shadow"></div>
    <div class="pet-name">Airi</div>
    <div class="pet-status">
      <span class="dot" id="dot"></span><span id="statusLabel">connecting...</span>
    </div>
  </div>

  <!-- 右键菜单 -->
  <div class="context-menu" id="contextMenu">
    <div class="menu-item" data-action="exit">退出 Airi</div>
  </div>

  <script>
    var PORT = {{PORT}};
    var CHAR_IMG = "{{CHARACTER_IMAGE}}";
    var SSE_URL = 'http://127.0.0.1:' + PORT + '/events';
    var EVENT_URL = 'http://127.0.0.1:' + PORT + '/event';

    // DOM
    var bubbleArea = document.getElementById('bubbleArea');
    var charBox = document.getElementById('charBox');
    var charImg = document.getElementById('charImg');
    var cssChar = document.getElementById('cssChar');
    var dotEl = document.getElementById('dot');
    var statusLabel = document.getElementById('statusLabel');
    var petArea = document.getElementById('petArea');
    var contextMenu = document.getElementById('contextMenu');
    var MAX_BUBBLES = 3;
    var currentEmotion = 'idle';
    var emotionTimer = null;

    // ============ 情绪立绘切换 ============
    function setEmotion(emotion) {
      if (!emotion) return;
      if (emotion !== currentEmotion) {
        currentEmotion = emotion;
        charBox.setAttribute('data-emotion', emotion);

        // 尝试加载情绪对应图片
        if (CHAR_IMG && CHAR_IMG.length > 0) {
          var base = CHAR_IMG.replace(/(\.\w+)$/, '_' + emotion + '$1');
          var testImg = new Image();
          testImg.onload = function() {
            charImg.src = base;
            charImg.style.display = 'block';
            cssChar.classList.remove('visible');
          };
          testImg.onerror = function() {
            charImg.src = CHAR_IMG;
            charImg.style.display = 'block';
            cssChar.classList.remove('visible');
          };
          testImg.src = base;
        }
      }

      // 8 秒后恢复默认表情（连续同情绪消息也要重置计时，
      // 否则间隔小于 8s 的第二条很快会被上一条的计时打回 idle）
      clearTimeout(emotionTimer);
      emotionTimer = setTimeout(function() {
        currentEmotion = 'idle';
        charBox.setAttribute('data-emotion', 'idle');
        // 立绘也要切回默认图，否则会一直停留在情绪变体
        if (CHAR_IMG && CHAR_IMG.length > 0) charImg.src = CHAR_IMG;
      }, 8000);
    }

    // ============ 自定义图片加载 ============
    if (CHAR_IMG && CHAR_IMG.length > 0) {
      charImg.onerror = function() {
        charImg.style.display = 'none';
        cssChar.classList.add('visible');
      };
      charImg.src = CHAR_IMG;
      charImg.style.display = 'block';
      cssChar.classList.remove('visible');
    }

    // ============ 气泡逻辑 ============
    function removeBubble(el) {
      if (el.dataset.removing) return;
      el.dataset.removing = '1';
      el.classList.add('fade-out');
      setTimeout(function() { el.remove(); }, 450);
    }

    function pruneBubbles() {
      var bubbles = bubbleArea.querySelectorAll('.bubble:not([data-removing])');
      if (bubbles.length >= MAX_BUBBLES) {
        removeBubble(bubbles[0]);
      }
      var remaining = bubbleArea.querySelectorAll('.bubble:not([data-removing])');
      if (remaining.length >= 2) {
        remaining[remaining.length - 2].classList.add('old');
      }
    }

    // 打字机效果：逐字显示，让气泡更生动
    function typeText(el, text) {
      var i = 0;
      var speed = Math.max(16, Math.min(38, Math.round(1100 / Math.max(text.length, 1))));
      (function type() {
        if (i < text.length) {
          el.textContent += text.charAt(i++);
          setTimeout(type, speed);
        }
      })();
    }

    function showBubble(text, isError) {
      pruneBubbles();
      var el = document.createElement('div');
      el.className = isError ? 'bubble error' : 'bubble';
      el.dataset.created = Date.now();
      bubbleArea.appendChild(el);
      typeText(el, text);
      // 轻推角色
      charBox.style.animation = 'none';
      charBox.offsetHeight;
      charBox.style.animation = 'idleSway 4s infinite ease-in-out';
    }

    function setOnline(online) {
      dotEl.classList.toggle('offline', !online);
      statusLabel.textContent = online ? 'online' : 'offline';
    }

    // ============ SSE 连接 ============
    function connectSSE() {
      var es = new EventSource(SSE_URL);
      es.onopen = function() {
        setOnline(true);
        fetch(EVENT_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type: 'desktopReady' }) }).catch(function() {});
      };
      es.onmessage = function(event) {
        try {
          var msg = JSON.parse(event.data);
          if (!msg || !msg.type) return;
          var emotion = (msg.payload && msg.payload.emotion) || 'idle';
          switch (msg.type) {
            case 'chatMessage': showBubble(msg.payload.text || '', false); setEmotion(emotion); break;
            case 'errorAlert': showBubble(msg.payload.text || '', true); setEmotion(emotion || 'angry'); break;
            case 'backendExit': setOnline(false); showBubble('Airi 已离线…', true); break;
            case 'pythonMessage': if (msg.payload && msg.payload.message) { showBubble(msg.payload.message, false); setEmotion(emotion); } break;
          }
        } catch (e) {}
      };
      es.onerror = function() { setOnline(false); };
      return es;
    }

    // ============ 拖拽移动 ============
    var dragging = false, dragStartX = 0, dragStartY = 0, winStartX = 0, winStartY = 0;

    petArea.addEventListener('mousedown', function(e) {
      if (e.button !== 0) return;
      dragging = true;
      dragStartX = e.screenX; dragStartY = e.screenY;
      winStartX = window.screenX || 0; winStartY = window.screenY || 0;
      if (window.pywebview && window.pywebview.api) {
        try {
          var p = window.pywebview.api.get_position();
          if (p && typeof p.then === 'function') {
            p.then(function(pos) { winStartX = pos[0]; winStartY = pos[1]; }, function() {});
          } else { winStartX = p[0] || winStartX; winStartY = p[1] || winStartY; }
        } catch (err) {}
      }
      e.preventDefault();
    });

    document.addEventListener('mousemove', function(e) {
      if (!dragging) return;
      try {
        if (window.pywebview && window.pywebview.api)
          window.pywebview.api.move_window(winStartX + e.screenX - dragStartX, winStartY + e.screenY - dragStartY);
      } catch (err) {}
      e.preventDefault();
    });

    document.addEventListener('mouseup', function() { dragging = false; });

    // ============ 右键菜单 ============
    petArea.addEventListener('contextmenu', function(e) {
      e.preventDefault();
      contextMenu.style.left = e.clientX + 'px';
      contextMenu.style.top = e.clientY + 'px';
      contextMenu.classList.add('show');
    });
    document.addEventListener('click', function() { contextMenu.classList.remove('show'); });
    // 屏蔽 frameless 窗口里的浏览器默认右键菜单（头像区已有自定义菜单）
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
    contextMenu.addEventListener('click', function(e) {
      var a = e.target.getAttribute('data-action');
      if (a === 'exit') {
        try { if (window.pywebview && window.pywebview.api) window.pywebview.api.exit_app(); } catch (err) {}
      }
      contextMenu.classList.remove('show');
    });

    // ============ 气泡自动消失 ============
    setInterval(function() {
      var bubbles = bubbleArea.querySelectorAll('.bubble:not([data-removing])'), now = Date.now();
      bubbles.forEach(function(b) {
        if (!b.dataset.created) b.dataset.created = now;
        if (now - parseInt(b.dataset.created) > 8000) {
          removeBubble(b);
        }
      });
    }, 2000);

    // ============ 启动 ============
    connectSSE();
  </script>
</body>
</html>
